<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="NOVA Dziennik Tradera — planuj, analizuj i wyciągaj wnioski z każdej transakcji.">
<title>NOVA Dziennik Tradera</title>
<style>
:root{
  --bg:#050d18; --panel:#0a1b2d; --panel2:#0d2339; --line:#16466e;
  --blue:#168cff; --blue2:#49a9ff; --text:#f3f7fb; --muted:#91acc7;
  --green:#38c98b; --red:#ef5664; --gold:#e7b243;
}
*{box-sizing:border-box}
html,body{margin:0;background:#030303;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:none;min-height:100vh;margin:0;padding-bottom:90px;border:1px solid rgba(214,153,42,.82);}
header{
  padding:28px 22px 22px;text-align:center;border-bottom:1px solid rgba(214,153,42,.55);
  background:#030303;
}
.logo{font-size:22px;font-weight:900;letter-spacing:5px;color:#fff}
.logo span{color:#e0a52f;text-shadow:0 0 18px rgba(224,165,47,.12)}
h1{font-size:clamp(34px,7vw,64px);margin:14px 0 8px;line-height:1.02}
h1 span{color:var(--blue)}
.tagline{color:#9f9b91;font-size:17px;margin:0}
main{padding:24px}
.page{display:none}.page.active{display:block}
.hero{
  position:relative;overflow:hidden;text-align:center;
  min-height:560px;padding:76px 22px 55px;border:0;
  border-radius:0;
  background:
    radial-gradient(circle at 50% 18%,rgba(214,153,42,.10),transparent 30%),
    radial-gradient(circle at 50% 65%,rgba(214,153,42,.035),transparent 42%),
    #030303;
  box-shadow:none;display:flex;flex-direction:column;align-items:center;
}
.hero:after{
  content:"";position:absolute;left:-10%;right:-10%;bottom:35px;height:190px;opacity:.32;
  background:
    linear-gradient(165deg,transparent 0 42%,rgba(214,153,42,.18) 43%,transparent 44%),
    linear-gradient(175deg,transparent 0 62%,rgba(214,153,42,.10) 63%,transparent 64%),
    repeating-linear-gradient(90deg,transparent 0 54px,rgba(214,153,42,.045) 55px 56px);
  transform:skewY(-4deg);pointer-events:none
}
.hero>*{position:relative;z-index:1}
.hero .nova{font-size:16px;letter-spacing:10px;font-weight:900;color:#dfe9f4;margin-bottom:35px}
.hero h2{
  font-size:clamp(38px,7vw,70px);margin:0;line-height:1.03;
  font-weight:900;letter-spacing:-1.5px;text-transform:none
}
.hero h2 span{
  color:#e0a52f;
  text-shadow:0 0 22px rgba(224,165,47,.14)
}
.hero p{max-width:620px;margin:22px auto 0;color:var(--muted);font-size:17px;line-height:1.55}
.start-choices{
  display:flex;align-items:center;justify-content:center;gap:42px;
  margin-top:58px
}
.start-choice{
  appearance:none;background:transparent;color:#dfeaf5;border:0;
  padding:13px 18px;position:relative;min-width:185px;
  font-size:18px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;
  transition:.2s
}
.start-choice:hover{
  color:#fff;
  transform:translateY(-2px);
  text-shadow:0 0 14px rgba(224,165,47,.16)
}
.start-choice.guide:before,
.start-choice.guide:after{
  content:"";position:absolute;top:4px;bottom:4px;width:10px;
  border-top:2px solid #c8922c;border-bottom:2px solid #c8922c
}
.start-choice.guide:before{left:0;border-left:2px solid #c8922c}
.start-choice.guide:after{right:0;border-right:2px solid #c8922c}

.start-disclaimer{
  margin-top:auto;
  padding:22px 18px 0;
  max-width:620px;
  color:#77736b;
  font-size:11px;
  line-height:1.5;
  text-align:center;
  letter-spacing:.1px;
}
.start-disclaimer strong{color:#9a8a68;font-weight:600}

.start-choice.journal{
  border:1px solid rgba(224,165,47,.82);border-radius:12px;
  background:linear-gradient(145deg,rgba(38,27,10,.62),rgba(12,9,4,.70));
  box-shadow:0 8px 30px rgba(0,0,0,.28)
}
.start-choice.journal:hover{
  border-color:#f0b83e;
  box-shadow:0 10px 34px rgba(224,165,47,.14)
}
.arrow{display:none}
.section-title{margin:4px 0 18px;font-size:30px}

  background:linear-gradient(145deg,#0b2034,#081728);border:1px solid #17486f;
